name: flowpilot-company
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowpilot_local_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-flowpilot}
    ports: ['127.0.0.1:${DB_PORT:-5433}:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flowpilot}:${POSTGRES_PASSWORD:-flowpilot_local_change_me}@db:5432/${POSTGRES_DB:-flowpilot}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@2026!}
      SEED_DEMO: ${SEED_DEMO:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: 3001
    ports: ['127.0.0.1:${API_PORT:-3001}:3001']
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  web:
    build: ./frontend
    environment:
      API_URL: http://api:3001
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports: ['127.0.0.1:${WEB_PORT:-3000}:3000']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
volumes:
  postgres_data:
